[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phishscope"
version = "0.0.1"
description = "Offline-first phishing email analyzer with explainable scoring and one-click reports"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "kwstys" }]
keywords = [
    "phishing",
    "email-security",
    "security-tools",
    "dfir",
    "soc",
    "incident-response",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]

# 运行依赖。
# 原则：能用标准库解决的绝不用第三方——让工具更容易被别人安装。
dependencies = [
    "rich>=13.0",
    "tldextract>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".sandbox-tools", ".tmp"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort（导入排序）
    "N",   # pep8-naming
    "UP",  # pyupgrade（用新语法）
    "B",   # flake8-bugbear（常见 bug）
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff 自有规则
]
# RUF001/002/003 会把中文全角标点判为易混淆字符。
# 中文注释是刻意写的，关掉这三条。
ignore = [
    "RUF001", # 字符串中的易混淆 Unicode 字符
    "RUF002", # 文档字符串中的易混淆 Unicode 字符
    "RUF003", # 注释中的易混淆 Unicode 字符
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
