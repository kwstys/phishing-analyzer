# 中文诱导话术词库
#
# 分 6 类，类别决定严重程度：
#   credential 索要凭据（高）· threat 威胁后果（中）· finance 财务诱导（中）
#   reward 承诺利益（中）· urgency 紧迫感（低）· action 催促操作（低）
#
# 来源：自己收到的真实钓鱼邮件。厂商报告里的词往往已经过时，真实邮件里
# 当下在用的说法才管用。下面每个分类只是格式示例，按实际情况增补替换。
#
# 两条维护规则：
#   1. 收短语，不收单词。「账户」「验证」「点击」正常邮件里到处都是。
#      「电子发票」「对账单」「工资条」也一样——它们是财务正常用语，
#      收了之后每封正常发票邮件都会命中。
#   2. 别带「请」这类前缀。写「请验证您的身份」，遇到「请立即验证您的身份」
#      就匹配不上——中文会往动词前面插副词（立即 / 尽快 / 马上）。只留核心短语。

# 索要密码 / 验证码 / 身份证件
credential:
  - 验证您的身份
  - 输入您的密码
  - 输入短信验证码
  - 重新登录验证
  - 确认您的银行账号
  - 提供身份证号码
  - 绑定银行卡验证

# 威胁后果
threat:
  - 账户将被停用
  - 账号已被冻结
  - 检测到异常登录
  - 账户存在安全风险
  - 您的账户已被限制
  - 逾期将影响征信
  - 否则将追究法律责任

# 财务诱导
finance:
  - 收款账户已变更
  - 及时缴款
  - 款项尚未结清
  - 核对汇款信息

# 承诺利益
reward:
  - 恭喜您中奖
  - 领取您的奖品
  - 退税通知
  - 积分即将过期
  - 您有一笔退款待领取

# 制造紧迫感
urgency:
  - 立即处理
  - 最后通知
  - 逾期作废
  - 尽快办理
  - 今日内有效
  - 24小时内
  - 48小时内

# 催促点击 / 下载 / 扫码
action:
  - 点击下方链接
  - 立即验证
  - 下载附件查看
  - 扫码办理
  - 点击此处
