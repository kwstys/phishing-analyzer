# 品牌清单
#
# 检查什么：品牌名是不是被冒用了
#   例：显示名写「Microsoft 账户团队」，发件域却是 microsoft-support.top
#       或者链接域名里含品牌词，但注册域不属于该品牌
#
# 被哪条检查使用：
#   显示名仿冒品牌        严重程度：高
#   仿冒品牌的近似域名    严重程度：高
#
# 选词规则（这份文件最容易造成误报，务必遵守）
#
#   aliases 里只收组合词，不收单个通用词。
#
#     收   ：Apple ID、微软账户、工行、顺丰快递
#     不收 ：「苹果」「微软」「长城」「东方」单独出现
#
#   判断标准：这个词出现在正常邮件里的概率有多大？
#
# domains 的填写规则
#
#   只写「只有该品牌才能从它发信」的域名。
#   免费邮箱域名不要写进来，哪怕那邮箱是品牌自己的：
#
#     qq.com 是腾讯的，但任何人都能注册 @qq.com，所以它证明不了腾讯身份
#     outlook.com / live.com 之于微软、163.com / 126.com 之于网易同理
#
#   这类情况交给「使用免费邮箱却声称企业身份」那条检查处理。
#
# 字段：
#   name     品牌标准名，会出现在报告里
#   aliases  在显示名与域名里要匹配的词（组合词）
#   domains  该品牌的合法域名。发件域不在此列 → 触发检查
#
# 维护：新增品牌 = 加一组。domains 要写全（含子业务域名），
#       漏写会让品牌自己的正常邮件被误判。
#          纯数字的别名必须加引号（如 "10086"），否则 YAML 会当成整数，
#          代码里做不了字符串匹配。
# 国际科技公司——被仿冒最多的一类
international_tech:
  - name: Microsoft
    aliases: [Microsoft 账户, Microsoft 帐户, Microsoft 团队, 微软账户, 微软帐户, 微软客服, Office 365, Microsoft 365, OneDrive, Outlook 团队]
    domains: [microsoft.com, microsoftonline.com, microsoft365.com, office.com, office365.com, sharepoint.com, onmicrosoft.com, azure.com]

  - name: Apple
    aliases: [Apple ID, iCloud, App Store, 苹果账户, 苹果帐户, 苹果客服, 苹果官方]
    # icloud.com / me.com 虽然属于 Apple，但任何人都能注册 @icloud.com，
    # 它证明不了 Apple 身份，所以不列在这里。
    domains: [apple.com, apple.com.cn]

  - name: Google
    aliases: [Google 账户, Google 帐号, Google Play, Gmail 团队]
    domains: [google.com, youtube.com, googleusercontent.com, withgoogle.com]

  - name: Amazon
    aliases: [Amazon 账户, 亚马逊账户, Amazon Prime, 亚马逊客服]
    domains: [amazon.com, amazon.cn, amazonaws.com, a.co]

  - name: PayPal
    aliases: [PayPal 账户, PayPal 帐号, PayPal 客服]
    domains: [paypal.com, paypal.me, paypal-community.com]

  - name: Netflix
    aliases: [Netflix 账户, Netflix 会员, Netflix 订阅]
    domains: [netflix.com]

  - name: Meta
    aliases: [Facebook 账户, Facebook 帐号, Instagram 账户, WhatsApp 验证]
    domains: [facebook.com, fb.com, meta.com, instagram.com, whatsapp.com]

  - name: Adobe
    aliases: [Adobe 账户, Adobe 订阅, Adobe 客服]
    domains: [adobe.com]

  - name: Dropbox
    aliases: [Dropbox 账户, Dropbox 空间]
    domains: [dropbox.com]

  - name: LinkedIn
    aliases: [LinkedIn 账户, 领英账户, 领英客服]
    domains: [linkedin.com, lnkd.in]

  - name: DHL
    aliases: [DHL 快递, DHL 包裹, DHL 客服]
    domains: [dhl.com, dhl.de]

  - name: FedEx
    aliases: [FedEx 包裹, FedEx 快递]
    domains: [fedex.com]

  - name: UPS
    aliases: [UPS 包裹, UPS 快递]
    domains: [ups.com]

